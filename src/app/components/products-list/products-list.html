<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
  <div *ngFor="let product of products; trackBy: trackByProductId" 
       class="bg-white rounded-lg shadow-sm p-4 group hover:shadow-lg transition-shadow">
    <div class="relative mb-4">
      <img [src]="product.images[0] || 'https://via.placeholder.com/150'" 
           [alt]="product.title" 
           class="w-full h-40 object-cover rounded">
      <button (click)="addToCart(product)" 
              class="w-full bg-red-500 text-white py-2 rounded absolute bottom-0 opacity-0 group-hover:opacity-100 transition-opacity">
        Add to Cart
      </button>
    </div>
    <h4 class="font-medium text-gray-900 mb-2 line-clamp-2">{{ product.title }}</h4>
    <p class="text-red-500 font-bold">${{ product.price }}</p>
  </div>
</div>
